# ==================================================================
# Academic Performance Analytics & Prediction Platform - main config
# ==================================================================
# Values in the form ${ENV_VAR:default} can be overridden with an
# environment variable (or a .env / IDE run configuration) without
# editing this file. The defaults are for LOCAL DEVELOPMENT only.

spring.application.name=academic-performance-platform
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------
# MySQL datasource (project-local MySQL 8 instance - see database/)
# ------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/academic_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:academic_user}
spring.datasource.password=${DB_PASSWORD:Academic@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP is Spring Boot's default pool)
spring.datasource.hikari.pool-name=AcademicPerformancePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------------
# JPA / Hibernate
#   ddl-auto=update  -> Hibernate creates/updates tables from entities.
#                       Good for development; a real deployment would use
#                       a migration tool such as Flyway.
#   open-in-view=false -> do not keep a DB session open during rendering.
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------
# JSON (Jackson)
# ------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ------------------------------------------------------------------
# Application specific settings
# ------------------------------------------------------------------
# Comma separated list of origins allowed to call the API (the Vite dev server).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT settings. The secret is read from the JWT_SECRET environment variable.
# The default below is for LOCAL DEVELOPMENT ONLY - replace it with a long
# random value (at least 32 characters) in any real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdefghijklmnop}
# Token lifetime in milliseconds (86400000 = 24 hours).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------
# Demo data seeding (Stages 3-11)
#   app.seed.enabled=true  -> on startup, create the demo department,
#                             ADMIN / FACULTY / STUDENT accounts if missing,
#                             plus a small academic history for the demo
#                             student (subjects, exams, attendance, marks,
#                             assignments, submissions and previous results).
#                             Every step is idempotent: it NEVER updates or
#                             deletes existing rows.
#   Set APP_SEED_ENABLED=false (or delete these lines) for production.
#   The passwords below are DEVELOPMENT-ONLY samples; they are hashed with
#   BCrypt before being stored. See README.md for the login table.
# ------------------------------------------------------------------
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.department.name=${SEED_DEPARTMENT_NAME:Computer Science}
app.seed.department.code=${SEED_DEPARTMENT_CODE:CS}
app.seed.admin.username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@campus.edu}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin@123}
app.seed.faculty.username=${SEED_FACULTY_USERNAME:faculty1}
app.seed.faculty.email=${SEED_FACULTY_EMAIL:faculty1@campus.edu}
app.seed.faculty.password=${SEED_FACULTY_PASSWORD:Faculty@123}
app.seed.student.username=${SEED_STUDENT_USERNAME:student1}
app.seed.student.email=${SEED_STUDENT_EMAIL:student1@campus.edu}
app.seed.student.password=${SEED_STUDENT_PASSWORD:Student@123}

# ------------------------------------------------------------------
# Error handling - never leak stack traces or internals to clients
# ------------------------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.academic.performance=DEBUG
